[package]
name = "captive_logger"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "autologger"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
console = "0.16.6"
